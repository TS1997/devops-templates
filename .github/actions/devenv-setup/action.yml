name: Devenv setup
description: Install Nix and devenv and build the project's CI tools (devenv outputs.ci)

inputs:
  devenv-version:
    description: devenv release to install (a tag of github:cachix/devenv)
    required: false
    default: v2.4.0
  devenv-options:
    description: >
      devenv option overrides used to build the CI tools, one
      "<attribute>:<type> <value>" per line (see devenv --option).
    required: false
    default: ""
  nix-cache:
    description: >
      Restore /nix/store from the Actions cache, keyed on the devenv files; it
      is saved after a successful job.
    required: false
    default: "true"
  age-key:
    description: >
      age identity for the common secrets (secret CI_AGE_KEY). When set,
      services.ts1997.tokens.variables are exported to the following steps
      like the dev shell does locally, and their values are masked in the log.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        github_access_token: ${{ github.token }}

    - name: Use the devenv binary cache
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: devenv

    - name: Restore Nix store
      if: inputs.nix-cache == 'true'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: devenv-${{ runner.os }}-${{ hashFiles('devenv.yaml', 'devenv.lock', 'devenv.nix') }}
        restore-prefixes-first-match: devenv-${{ runner.os }}-
        gc-max-store-size-linux: 6G

    - name: Install devenv
      shell: bash
      env:
        DEVENV_VERSION: ${{ inputs.devenv-version }}
        DEVENV_OPTIONS: ${{ inputs.devenv-options }}
      run: |
        nix profile add "github:cachix/devenv/$DEVENV_VERSION"

        args=()
        while read -r option value; do
          [[ -n "$option" ]] && args+=(--option "$option" "$value")
        done <<< "$DEVENV_OPTIONS"

        # Only the tools the build steps need (outputs.ci,
        # nix/utils/ci.devenv.nix), not the dev shell.
        tools="$(devenv "${args[@]}" build outputs.ci | jq -r '.["outputs.ci"]')"
        echo "$tools/bin" >> "$GITHUB_PATH"

    - name: Load tokens
      if: inputs.age-key != ''
      shell: bash
      env:
        AGE_KEY: ${{ inputs.age-key }}
      run: |
        if ! command -v tokens > /dev/null; then
          echo "No services.ts1997.tokens.variables set; skipping tokens."
          exit 0
        fi

        key_file="$RUNNER_TEMP/ci-age-key"
        trap 'rm -f "$key_file"' EXIT
        (umask 077 && printf '%s\n' "$AGE_KEY" > "$key_file")
        # Masks the values and appends them to $GITHUB_ENV. DEVENV_ROOT
        # locates services.ts1997.tokens.projectFile.
        DEVENV_ROOT="$PWD" AGE_IDENTITY="$key_file" tokens --github-env

    - name: Show CI tools
      shell: devenv-run {0}
      run: |
        php --version
        composer --version
        echo "node $(node --version), npm $(npm --version)"
