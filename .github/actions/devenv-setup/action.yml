name: Devenv setup
description: Install Nix and devenv and build the project's devenv shell

inputs:
  devenv-version:
    description: devenv release to install (a tag of github:cachix/devenv)
    required: false
    default: v2.4.0
  devenv-options:
    description: >
      devenv option overrides applied to every devenv-run step, one
      "<attribute>:<type> <value>" per line (see devenv --option). The default
      turns off the Composer and npm installs the dev shell runs on entry, since
      the build actions install production dependencies themselves.
    required: false
    default: |
      services.ts1997.phpfpm.composer.install.enable:bool false
      languages.javascript.npm.install.enable:bool false
  nix-cache:
    description: >
      Restore /nix/store from the Actions cache, keyed on the devenv files; it
      is saved after a successful job.
    required: false
    default: "true"
  age-key:
    description: >
      age identity for the common secrets (secret CI_AGE_KEY). When set, the
      devenv shell exports services.ts1997.tokens.variables like it does
      locally, and their values are masked in the log.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        github_access_token: ${{ github.token }}

    - name: Use the devenv binary cache
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: devenv

    - name: Restore Nix store
      if: inputs.nix-cache == 'true'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: devenv-${{ runner.os }}-${{ hashFiles('devenv.yaml', 'devenv.lock', 'devenv.nix') }}
        restore-prefixes-first-match: devenv-${{ runner.os }}-
        gc-max-store-size-linux: 6G

    - name: Install devenv
      shell: bash
      env:
        DEVENV_VERSION: ${{ inputs.devenv-version }}
        DEVENV_OPTIONS: ${{ inputs.devenv-options }}
      run: |
        nix profile add "github:cachix/devenv/$DEVENV_VERSION"

        args=()
        while read -r option value; do
          [[ -n "$option" ]] && args+=(--option "$option" "$value")
        done <<< "$DEVENV_OPTIONS"

        # Every step shell enters the devenv shell with the same options.
        bin="$RUNNER_TEMP/devenv-bin"
        mkdir -p "$bin"
        {
          echo '#!/usr/bin/env bash'
          printf 'exec devenv'
          if (( ${#args[@]} )); then printf ' %q' "${args[@]}"; fi
          printf ' shell -- bash -euo pipefail "$@"\n'
        } > "$bin/devenv-run"
        chmod +x "$bin/devenv-run"
        echo "$bin" >> "$GITHUB_PATH"

    # The tokens module in the devenv shell decrypts with $AGE_IDENTITY on
    # every devenv-run step and masks the values (::add-mask::) first.
    - name: Load age key
      if: inputs.age-key != ''
      shell: bash
      env:
        AGE_KEY: ${{ inputs.age-key }}
      run: |
        key_file="$RUNNER_TEMP/ci-age-key"
        (umask 077 && printf '%s\n' "$AGE_KEY" > "$key_file")
        echo "AGE_IDENTITY=$key_file" >> "$GITHUB_ENV"

    - name: Build devenv shell
      shell: devenv-run {0}
      run: |
        php --version
        composer --version
        echo "node $(node --version), npm $(npm --version)"
