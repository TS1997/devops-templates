# Runs inside a deploy repo (e.g. terraflake): updates one flake input
# (optionally pinned to a rev), deploys every host whose system changed, then
# commits and pushes flake.lock. Usually dispatched by request-flake-deploy.yml.
#
# The deploy repo's flake must expose these packages:
#   deploy-input        `deploy-input INPUT [REV] [DEPLOY-ARGS...]`
#   <secrets_package>   reads $CI_AGE_KEY_FILE, writes .tokens.sh and loads
#                       the deploy SSH key into the running ssh-agent
#
# Callers must grant `contents: write` and pass these secrets explicitly
# (`secrets: inherit` only works within the same organization; environment
# secrets must be passed by name too):
#   DEPLOY_MANAGER_PRIVATE_KEY  private key of the DeployManager App
#                               (Contents: read on the private flake inputs)
#   CI_AGE_KEY                  age identity that the tokens and deploy SSH key
#                               are rekeyed to. Used by the `secrets_package`
#                               flake app, which writes .tokens.sh and loads the
#                               key into ssh-agent.
# and have the variable DEPLOY_MANAGER_APP_ID (repo, org or environment level).
#
# Runs on the same branch are queued (up to 100) and check out the branch tip
# when they start, so every deploy builds on the flake.lock pushed by the
# previous one. Callers should not set their own `concurrency`: the default
# queue drops waiting runs, and reusing the group `flake-deploy-<ref>`
# deadlocks.
#
# /nix/store is kept in the Actions cache (`nix_cache`). Store paths containing
# a file named in `nix_cache_exclude` (the pulled OpenTofu state by default) are
# deleted before the cache is saved.

name: Flake deploy

on:
  workflow_call:
    inputs:
      flake_input:
        description: "Name of the flake input to update, e.g. lead-flow-engine"
        required: true
        type: string
      rev:
        description: "Commit to pin the input to (github inputs only). Empty = latest."
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub environment holding the deploy credentials"
        required: false
        type: string
        default: "deploy"
      deploy_args:
        description: "Extra deploy-rs arguments. Checks are skipped since deploy-input already evaluates every host."
        required: false
        type: string
        default: "--skip-checks"
      host_keys_glob:
        description: "Glob of host public keys used to build known_hosts"
        required: false
        type: string
        default: "nixos/servers/*/ssh-host-key.pub"
      secrets_package:
        description: "Flake package that decrypts the secrets with $CI_AGE_KEY_FILE"
        required: false
        type: string
        default: "ci-secrets"
      nix_cache:
        description: "Keep /nix/store in the GitHub Actions cache between runs"
        required: false
        type: boolean
        default: true
      nix_cache_exclude:
        description: "Space-separated file names. Store paths containing one of them (e.g. flake sources with pulled state) and everything referring to them are deleted before caching."
        required: false
        type: string
        default: "terraform.tfstate"
    secrets:
      DEPLOY_MANAGER_PRIVATE_KEY:
        required: true
      CI_AGE_KEY:
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Two concurrent deploys would each build from a flake.lock missing the
    # other's update, rolling back the other app on shared hosts.
    concurrency:
      group: flake-deploy-${{ github.ref }}
      queue: max
    steps:
      - name: Validate inputs
        env:
          FLAKE_INPUT: ${{ inputs.flake_input }}
          REV: ${{ inputs.rev }}
        run: |
          if [[ ! "$FLAKE_INPUT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid flake_input: $FLAKE_INPUT"
            exit 1
          fi
          if [[ -n "$REV" && ! "$REV" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid rev: $REV"
            exit 1
          fi

      # The branch tip, not the commit the run was dispatched at: a run that
      # waited for the previous deploy must see the flake.lock it pushed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Not ./.github/actions/...: ./ is the caller's checkout here.
      - name: Setup
        uses: TS1997/devops-templates/.github/actions/flake-setup@master
        with:
          app-id: ${{ vars.DEPLOY_MANAGER_APP_ID }}
          app-private-key: ${{ secrets.DEPLOY_MANAGER_PRIVATE_KEY }}
          ci-age-key: ${{ secrets.CI_AGE_KEY }}
          secrets-package: ${{ inputs.secrets_package }}
          ssh: "true"
          host-keys-glob: ${{ inputs.host_keys_glob }}
          nix-cache: ${{ inputs.nix_cache }}
          free-disk-space: "true"

      - name: Update input and deploy
        env:
          FLAKE_INPUT: ${{ inputs.flake_input }}
          REV: ${{ inputs.rev }}
          DEPLOY_ARGS: ${{ inputs.deploy_args }}
        run: |
          read -ra deploy_args <<< "$DEPLOY_ARGS"
          nix run .#deploy-input -- "$FLAKE_INPUT" ${REV:+"$REV"} "${deploy_args[@]}"

      - name: Commit and push flake.lock
        env:
          FLAKE_INPUT: ${{ inputs.flake_input }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged; nothing to commit."
            exit 0
          fi

          locked_rev="$(jq -r --arg input "$FLAKE_INPUT" \
            '.nodes as $nodes | $nodes[$nodes.root.inputs[$input]].locked.rev // "unknown" | .[0:7]' flake.lock)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "deploy($FLAKE_INPUT): $locked_rev"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

          echo "Deployed \`$FLAKE_INPUT\` @ \`$locked_rev\`" >> "$GITHUB_STEP_SUMMARY"

      # The Nix store is saved after this step. Flake sources include the pulled
      # OpenTofu state, which must not end up in the cache: any branch can
      # restore caches from the default branch.
      - name: Remove excluded files from Nix store
        if: inputs.nix_cache
        env:
          EXCLUDE: ${{ inputs.nix_cache_exclude }}
        run: |
          read -ra names <<< "$EXCLUDE"
          shopt -s nullglob
          paths=()
          for name in "${names[@]}"; do
            for file in /nix/store/*/"$name"; do
              paths+=("${file%/"$name"}")
            done
          done
          if (( ${#paths[@]} == 0 )); then
            echo "Nothing to remove."
            exit 0
          fi

          mapfile -t doomed < <(nix-store --query --referrers-closure "${paths[@]}")
          echo "Removing ${#doomed[@]} store paths."
          nix-store --delete --ignore-liveness "${doomed[@]}" > /dev/null

          for name in "${names[@]}"; do
            leftover=(/nix/store/*/"$name")
            if (( ${#leftover[@]} )); then
              echo "::error::Still in the Nix store: ${leftover[*]}"
              exit 1
            fi
          done
