name: Laravel Deploy

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      additional_commands:
        required: false
        default: ""
        type: string
        description:
          "Additional deployment commands to run on the server before php
          artisan up."
      post_deploy_commands:
        required: false
        default: ""
        type: string
        description:
          "Additional deployment commands to run on the server after php
          artisan up."
      additional_excludes:
        required: false
        default: ""
        type: string
        description: "Additional patterns to exclude from deployment (space-separated)."
      environment:
        required: false
        default: "production"
        type: string
        description: "Environment to run workflow in."

    secrets:
      SSH_KEY:
        required: true
      CI_AGE_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # One deploy per environment at a time. A newer run waits, replacing any
    # run that is still pending; a running deploy is never cancelled. Callers
    # must not use the same group name.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup devenv
        uses: TS1997/devops-templates/.github/actions/devenv-setup@master
        with:
          age-key: ${{ secrets.CI_AGE_KEY }}

      - name: Resolve deploy target
        id: target
        env:
          HOSTS: services.ts1997.laravelSite.hosts.${{ inputs.environment }}
        run: |
          host="$(devenv eval "$HOSTS.host" | jq -r '.[]')"
          user="$(devenv eval "$HOSTS.user" | jq -r '.[]')"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Install Composer dependencies
        uses: TS1997/devops-templates/.github/actions/composer-install@master

      - name: Build assets
        uses: TS1997/devops-templates/.github/actions/npm-build@master

      - name: Activate maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ -f artisan ]; then
              php artisan down
              php artisan optimize:clear
            else
              echo "No artisan file found; skipping maintenance mode."
            fi

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@v8
        with:
          switches: >-
            -avzr --delete --exclude='.zsh_history' --exclude='.git*'
            --exclude='node_modules' --exclude='tests'
            --exclude='bootstrap/cache/*' --exclude='storage/***'
            --exclude='public/storage' --exclude='.env*'
            --exclude='phpunit.xml' --exclude='README.md'
            --exclude='.editorconfig' --exclude='.eslintrc.json'
            --exclude='.prettierrc' --exclude='.devenv*' ${{
            inputs.additional_excludes }}

          path: ./
          remote_path: ./
          remote_host: ${{ steps.target.outputs.host }}
          remote_user: ${{ steps.target.outputs.user }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Execute deployment commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache

            cat > bootstrap/cache/release-info.json <<EOF
            {
              "released_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "git_sha": "${{ github.sha }}",
              "deployed_by": "${{ github.actor }}",
              "build_number": "${{ github.run_number }}"
            }
            EOF

            php artisan optimize
            php artisan migrate --force
            ${{ inputs.additional_commands }}
            php artisan up
            ${{ inputs.post_deploy_commands }}

      - name: Health check
        uses: TS1997/devops-templates/.github/actions/health-check@master
        with:
          url: ${{ inputs.domain }}/up
