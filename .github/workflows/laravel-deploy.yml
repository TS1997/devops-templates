name: Laravel Deploy

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      additional_commands:
        required: false
        default: ""
        type: string
        description:
          "Additional deployment commands to run on the server before php
          artisan up."
      post_deploy_commands:
        required: false
        default: ""
        type: string
        description:
          "Additional deployment commands to run on the server after php
          artisan up."
      additional_excludes:
        required: false
        default: ""
        type: string
        description: "Additional patterns to exclude from deployment (space-separated)."
      environment:
        required: false
        default: "production"
        type: string
        description: "Environment to run workflow in."

    secrets:
      HOST:
        required: true
      USER:
        required: true
      SSH_KEY:
        required: true

      AUTH_JSON:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # One deploy per environment at a time. A newer run waits, replacing any
    # run that is still pending; a running deploy is never cancelled. Callers
    # must not use the same group name.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup devenv
        uses: TS1997/devops-templates/.github/actions/devenv-setup@master

      - name: Build
        uses: TS1997/devops-templates/.github/actions/laravel-build@master
        with:
          composer-auth: ${{ secrets.AUTH_JSON }}

      - name: Activate maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ -f artisan ]; then
              php artisan down
              php artisan optimize:clear
            else
              echo "No artisan file found; skipping maintenance mode."
            fi

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@v8
        with:
          switches: >-
            -avzr --delete --exclude='.zsh_history' --exclude='.git*'
            --exclude='node_modules' --exclude='tests'
            --exclude='bootstrap/cache/*' --exclude='storage/***'
            --exclude='public/storage' --exclude='.env*'
            --exclude='phpunit.xml' --exclude='README.md'
            --exclude='.editorconfig' --exclude='.eslintrc.json'
            --exclude='.prettierrc' --exclude='.devenv*' ${{
            inputs.additional_excludes }}

          path: ./
          remote_path: ./
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Execute deployment commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache

            cat > bootstrap/cache/release-info.json <<EOF
            {
              "released_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "git_sha": "${{ github.sha }}",
              "deployed_by": "${{ github.actor }}",
              "build_number": "${{ github.run_number }}"
            }
            EOF

            php artisan optimize
            php artisan migrate --force
            ${{ inputs.additional_commands }}
            php artisan up
            ${{ inputs.post_deploy_commands }}

      - name: Health check
        run: |
          echo "🔍 Starting health check..."
          max_attempts=5
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts"
            
            response=$(curl -L -s -o /dev/null -w "%{http_code}" ${{ inputs.domain }}/up || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Health check passed! Server responded with 200"
              exit 0
            fi
            
            echo "⚠️  Server responded with status code: $response"
            
            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
            
            attempt=$((attempt + 1))
          done

          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful to ${{ inputs.domain }}"
            echo "📦 Deployed commit: ${{ github.sha }}"
            echo "🕐 Deployment time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          else
            echo "❌ Deployment failed!"
            echo "💥 Failed commit: ${{ github.sha }}"
            echo "🕐 Failure time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          fi
