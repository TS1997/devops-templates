name: Laravel Publish Types

on:
  workflow_call:
    inputs:
      generation_command:
        required: false
        default: "php vendor/bin/testbench package-types:generate --ansi"
        type: string
        description: "Command that generates the npm package contents."
      package_directory:
        required: false
        default: "resources/types"
        type: string
        description: >-
          Directory containing the generated npm package. Its committed
          .npmrc sets the registry and auth (${BRAVO_NPM_TOKEN}).
      environment:
        required: false
        default: "production"
        type: string
        description: "Environment to run workflow in."

    secrets:
      CI_AGE_KEY:
        required: true
permissions:
  contents: read

jobs:
  publish-types:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-types-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup devenv
        uses: TS1997/devops-templates/.github/actions/devenv-setup@master
        with:
          age-key: ${{ secrets.CI_AGE_KEY }}
          devenv-options: |
            services.ts1997.laravelPackage.composer.install.enable:bool false
            languages.javascript.npm.install.enable:bool false

      - name: Install Composer dependencies
        uses: TS1997/devops-templates/.github/actions/composer-install@master
        with:
          composer-args: --no-interaction --prefer-dist --no-progress

      - name: Generate types package
        shell: devenv-run {0}
        run: ${{ inputs.generation_command }}

      - name: Check generated package changes
        id: package
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
        run: |
          if [ ! -d "$PACKAGE_DIRECTORY" ]; then
            echo "Package directory does not exist: $PACKAGE_DIRECTORY" >&2
            exit 1
          fi

          if [ ! -f "$PACKAGE_DIRECTORY/package.json" ]; then
            echo "Generated package is missing package.json: $PACKAGE_DIRECTORY/package.json" >&2
            exit 1
          fi

          current_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"

          if [ -z "$previous_tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous tag found; publishing generated package."
          elif git diff --quiet "$previous_tag" -- "$PACKAGE_DIRECTORY"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated package did not change since $previous_tag; skipping publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated package changed since $previous_tag; publishing package."
          fi

      - name: Resolve package version
        if: steps.package.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "This workflow must run for a tag so the npm package version can be resolved." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish types package
        if: steps.package.outputs.changed == 'true'
        shell: devenv-run {0}
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$PACKAGE_DIRECTORY"
          npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version
          npm publish

      - name: Publish summary
        if: always()
        run: |
          if [ "${{ steps.package.outputs.changed }}" != "true" ]; then
            echo "Generated types package was unchanged; publish skipped."
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Published types package version ${{ steps.version.outputs.version }}"
          else
            echo "Failed to publish generated types package."
          fi
