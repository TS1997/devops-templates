name: Static Site Deploy

on:
    workflow_call:
        inputs:
            health_check_domain:
                required: false
                default: ""
                type: string
                description: "Hostname to health-check, e.g. example.com. Defaults to the resolved hosts.<environment>.host from devenv.nix; only set this if the public domain differs from the deploy host. Defaults to https://; pass an explicit http:// or https:// prefix to override."
            health_check_path:
                required: false
                default: "/"
                type: string
                description: "Path on the domain that must respond with 200 after the deploy."
            build_dir:
                required: false
                default: "dist"
                type: string
                description: "Directory the npm build writes the site to; its contents are deployed."
            keep_releases:
                required: false
                default: 5
                type: number
                description: "With releases: number of releases to keep on the server."
            environment:
                required: false
                default: "production"
                type: string
                description: "Environment to run workflow in."

        secrets:
            SSH_KEY:
                required: true
            CI_AGE_KEY:
                # Only needed for services.ts1997.tokens (for example nodejs.auth).
                required: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
        # One deploy per environment at a time. A newer run waits, replacing
        # any run that is still pending; a running deploy is never cancelled.
        # Callers must not use the same group name.
        concurrency:
            group: deploy-${{ inputs.environment }}
            cancel-in-progress: false
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup devenv
              uses: TS1997/devops-templates/.github/actions/devenv-setup@master
              with:
                  age-key: ${{ secrets.CI_AGE_KEY }}

            - name: Resolve deploy target
              id: target
              shell: bash
              env:
                  HOSTS: services.ts1997.staticSite.hosts.${{ inputs.environment }}
                  HEALTH_CHECK_DOMAIN_INPUT: ${{ inputs.health_check_domain }}
              run: |
                  if ! target="$(devenv eval "$HOSTS" | jq -c '.[]')"; then
                    echo "::error::Set $HOSTS (host, siteName) in devenv.nix."
                    exit 1
                  fi
                  host="$(jq -r .host <<<"$target")"
                  echo "host=$host" >> "$GITHUB_OUTPUT"
                  echo "user=$(jq -r .user <<<"$target")" >> "$GITHUB_OUTPUT"
                  echo "health_check_domain=${HEALTH_CHECK_DOMAIN_INPUT:-$host}" >> "$GITHUB_OUTPUT"

            - name: Build site
              uses: TS1997/devops-templates/.github/actions/npm-build@master

            # Servers with releases.enable get a new release and an atomic
            # switch of ~/current; others are deployed in place.
            - name: Prepare release
              id: release
              uses: TS1997/devops-templates/.github/actions/release@master
              with:
                  command: prepare
                  host: ${{ steps.target.outputs.host }}
                  user: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}

            # Only the build output is uploaded.
            - name: Deploy to server via rsync
              uses: burnett01/rsync-deployments@2cbb5ed94b73d111d07a40b071b1c7d3c0272435 # 9.0.2
              with:
                  switches: -avzr --delete ${{ steps.release.outputs.rsync-args }}
                  path: ${{ inputs.build_dir }}/
                  remote_path: ${{ steps.release.outputs.remote-path }}
                  remote_host: ${{ steps.target.outputs.host }}
                  remote_user: ${{ steps.target.outputs.user }}
                  remote_key: ${{ secrets.SSH_KEY }}

            - name: Activate release
              if: steps.release.outputs.id != ''
              uses: TS1997/devops-templates/.github/actions/release@master
              with:
                  command: activate
                  host: ${{ steps.target.outputs.host }}
                  user: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}
                  id: ${{ steps.release.outputs.id }}
                  keep: ${{ inputs.keep_releases }}

            - name: Health check
              uses: TS1997/devops-templates/.github/actions/health-check@master
              with:
                  url: ${{ startsWith(steps.target.outputs.health_check_domain, 'http') && steps.target.outputs.health_check_domain || format('https://{0}', steps.target.outputs.health_check_domain) }}${{ inputs.health_check_path }}

            - name: Roll back release
              if: failure() && steps.release.outputs.id != ''
              uses: TS1997/devops-templates/.github/actions/release@master
              with:
                  command: rollback
                  host: ${{ steps.target.outputs.host }}
                  user: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}
                  id: ${{ steps.release.outputs.id }}
