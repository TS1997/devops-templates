name: Symfony Deploy

on:
  workflow_call:
    inputs:
      health_check_domain:
        required: false
        default: ""
        type: string
        description: "Hostname to health-check, e.g. example.com. Defaults to the resolved hosts.<environment>.host from devenv.nix; only set this if the public domain differs from the deploy host. Defaults to https://; pass an explicit http:// or https:// prefix to override."
      health_check_path:
        required: false
        default: "/"
        type: string
        description:
          "Path on the domain that must respond with 200 after the deploy.
          Empty skips the check. Behind basic auth, set the BASIC_AUTH secret."
      build_assets:
        required: false
        default: false
        type: boolean
        description:
          "Run the npm build (needs services.ts1997.symfonySite.nodejs.enable).
          AssetMapper apps compile on the server via additional_commands."
      additional_commands:
        required: false
        default: ""
        type: string
        description:
          "Commands run on the server before the release goes live, after
          cache:clear (e.g. doctrine:migrations:migrate, asset-map:compile)."
      post_deploy_commands:
        required: false
        default: ""
        type: string
        description:
          "Commands run on the server after the release went live, and again
          after a rollback (e.g. messenger:stop-workers)."
      additional_excludes:
        required: false
        default: ""
        type: string
        description: "Additional rsync switches, e.g. --exclude='/docs' (space-separated)."
      shared_paths:
        required: false
        default: ""
        type: string
        description:
          "With releases: extra paths (relative, space-separated) linked from
          ~/shared into every release, for server-only files and state. .env
          is always shared."
      keep_releases:
        required: false
        default: 5
        type: number
        description: "With releases: number of releases to keep on the server."
      environment:
        required: false
        default: "production"
        type: string
        description: "Environment to run workflow in."

    secrets:
      SSH_KEY:
        required: true
      CI_AGE_KEY:
        required: true
      BASIC_AUTH:
        required: false
        description: "user:password for the health check on sites behind basic auth."

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # One deploy per environment at a time. A newer run waits, replacing any
    # run that is still pending; a running deploy is never cancelled. Callers
    # must not use the same group name.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup devenv
        uses: TS1997/devops-templates/.github/actions/devenv-setup@master
        with:
          age-key: ${{ secrets.CI_AGE_KEY }}

      - name: Resolve deploy target
        id: target
        shell: bash
        env:
          HOSTS: services.ts1997.symfonySite.hosts.${{ inputs.environment }}
          HEALTH_CHECK_DOMAIN_INPUT: ${{ inputs.health_check_domain }}
        run: |
          if ! target="$(devenv eval "$HOSTS" | jq -c '.[]')"; then
            echo "::error::Set $HOSTS (host, siteName) in devenv.nix."
            exit 1
          fi
          echo "host=$(jq -r .host <<<"$target")" >> "$GITHUB_OUTPUT"
          echo "user=$(jq -r .user <<<"$target")" >> "$GITHUB_OUTPUT"

      # Flex auto-scripts (cache:clear, assets:install) need the server's
      # .env, so they run on the server instead.
      - name: Install Composer dependencies
        uses: TS1997/devops-templates/.github/actions/composer-install@master
        with:
          composer-args: --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress --no-scripts

      - name: Build assets
        if: inputs.build_assets
        uses: TS1997/devops-templates/.github/actions/npm-build@master

      # Servers with releases.enable get a new release and an atomic switch of
      # ~/current; others are deployed in place.
      - name: Prepare release
        id: release
        uses: TS1997/devops-templates/.github/actions/release@master
        with:
          command: prepare
          host: ${{ steps.target.outputs.host }}
          user: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_KEY }}

      # The server-generated .env is the only env file; var/ and
      # public/bundles are created on the server.
      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@2cbb5ed94b73d111d07a40b071b1c7d3c0272435 # 9.0.2
        with:
          switches: >-
            -avzr --delete --exclude='.zsh_history' --exclude='.git*'
            --exclude='node_modules' --exclude='/tests' --exclude='/var'
            --exclude='/public/bundles' --exclude='.env*'
            --exclude='/phpunit.xml*' --exclude='/phpstan*' --exclude='/.php-cs-fixer*'
            --exclude='README.md' --exclude='.editorconfig' --exclude='.prettierrc'
            --exclude='.devenv*' --exclude='.direnv' --exclude='/.envrc'
            --exclude='.vscode' --exclude='.idea' --exclude='.ai'
            --exclude='/secrets' --exclude='/.npmrc'
            --exclude='/devenv.*' --exclude='/*.nix'
            --exclude='/AGENTS.md' --exclude='/CLAUDE.md' --exclude='/.mcp.json'
            --exclude='/.cursor' --exclude='/.junie' --exclude='/.claude'
            ${{ steps.release.outputs.rsync-args }} ${{ inputs.additional_excludes }}

          path: ./
          remote_path: ${{ steps.release.outputs.remote-path }}
          remote_host: ${{ steps.target.outputs.host }}
          remote_user: ${{ steps.target.outputs.user }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Execute deployment commands
        if: steps.release.outputs.id == ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            php bin/console cache:clear --no-interaction
            php bin/console assets:install public --no-interaction
            ${{ inputs.additional_commands }}
            ${{ inputs.post_deploy_commands }}

      # Migrations only run forward and are never rolled back: they must work
      # with the live release's code too, since it keeps serving until the
      # switch and again after a rollback.
      - name: Activate release
        if: steps.release.outputs.id != ''
        uses: TS1997/devops-templates/.github/actions/release@master
        with:
          command: activate
          host: ${{ steps.target.outputs.host }}
          user: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          id: ${{ steps.release.outputs.id }}
          shared-paths: .env ${{ inputs.shared_paths }}
          keep: ${{ inputs.keep_releases }}
          before-switch: |
            php bin/console cache:clear --no-interaction
            php bin/console assets:install public --no-interaction
            ${{ inputs.additional_commands }}
          after-switch: ${{ inputs.post_deploy_commands }}

      - name: Health check
        if: inputs.health_check_path != ''
        uses: TS1997/devops-templates/.github/actions/health-check@master
        with:
          url: ${{ startsWith(steps.target.outputs.health_check_domain, 'http') && steps.target.outputs.health_check_domain || format('https://{0}', steps.target.outputs.health_check_domain) }}${{ inputs.health_check_path }}
          basic-auth: ${{ secrets.BASIC_AUTH }}

      - name: Roll back release
        if: failure() && steps.release.outputs.id != ''
        uses: TS1997/devops-templates/.github/actions/release@master
        with:
          command: rollback
          host: ${{ steps.target.outputs.host }}
          user: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          id: ${{ steps.release.outputs.id }}
          after-switch: ${{ inputs.post_deploy_commands }}
