name: WordPress Deploy

on:
    workflow_call:
        inputs:
            domain:
                required: true
                type: string
            health_check_path:
                required: false
                default: "/"
                type: string
                description: "Path on the domain that must respond with 200 after the deploy."
            pre_deploy_commands:
                required: false
                default: ""
                type: string
                description: "Commands to run on the server before the files are synced."
            post_deploy_commands:
                required: false
                default: ""
                type: string
                description: "Commands to run on the server after the files are synced (with releases: in the new release, after it went live)."
            additional_excludes:
                required: false
                default: ""
                type: string
                description:
                    "Additional rsync switches, e.g. --exclude='/config/bankid'
                    (space-separated). Excluded paths are also kept on the server;
                    with releases, list them in shared_paths too."
            shared_paths:
                required: false
                default: ""
                type: string
                description:
                    "With releases: extra paths (relative, space-separated, e.g.
                    config/bankid) linked from ~/shared into every release,
                    for server-only files. .env and public/content/uploads are
                    always shared."
            keep_releases:
                required: false
                default: 5
                type: number
                description: "With releases: number of releases to keep on the server."
            environment:
                required: false
                default: "production"
                type: string
                description: "Environment to run workflow in."

        secrets:
            SSH_KEY:
                required: true
            CI_AGE_KEY:
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
        # One deploy per environment at a time. A newer run waits, replacing
        # any run that is still pending; a running deploy is never cancelled.
        # Callers must not use the same group name.
        concurrency:
            group: deploy-${{ inputs.environment }}
            cancel-in-progress: false
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup devenv
              uses: TS1997/devops-templates/.github/actions/devenv-setup@master
              with:
                  age-key: ${{ secrets.CI_AGE_KEY }}
                  devenv-options: |
                      services.ts1997.phpfpm.composer.install.enable:bool false
                      languages.javascript.npm.install.enable:bool false

            - name: Resolve deploy target
              id: target
              env:
                  HOSTS: services.ts1997.wordpressSite.hosts.${{ inputs.environment }}
              run: |
                  host="$(devenv eval "$HOSTS.host" | jq -r '.[]')"
                  user="$(devenv eval "$HOSTS.user" | jq -r '.[]')"
                  echo "host=$host" >> "$GITHUB_OUTPUT"
                  echo "user=$user" >> "$GITHUB_OUTPUT"

            - name: Install Composer dependencies
              uses: TS1997/devops-templates/.github/actions/composer-install@master

            - name: Build assets
              uses: TS1997/devops-templates/.github/actions/npm-build@master

            # Servers with releases.enable get a new release and an atomic
            # switch of ~/current; others are deployed in place.
            - name: Prepare release
              id: release
              uses: TS1997/devops-templates/.github/actions/release@master
              with:
                  command: prepare
                  host: ${{ steps.target.outputs.host }}
                  user: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}

            - name: Execute pre-deploy commands
              if: inputs.pre_deploy_commands != ''
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ steps.target.outputs.host }}
                  username: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}
                  script: ${{ inputs.pre_deploy_commands }}

            # Uploads, caches and the server-generated .env live on the server only;
            # excluded paths are neither overwritten nor deleted.
            - name: Deploy to server via rsync
              uses: burnett01/rsync-deployments@v8
              with:
                  switches: >-
                      -avzr --delete --exclude='.zsh_history' --exclude='.git*'
                      --exclude='node_modules' --exclude='.devenv*' --exclude='.direnv'
                      --exclude='.envrc' --exclude='.env*' --exclude='.vscode'
                      --exclude='.editorconfig' --exclude='.prettierrc'
                      --exclude='README.md' --exclude='readme.md' --exclude='*.sql'
                      --exclude='wp-cli.local.yml'
                      --exclude='/public/content/uploads' --exclude='/public/content/cache'
                      --exclude='/public/content/upgrade'
                      ${{ steps.release.outputs.rsync-args }} ${{ inputs.additional_excludes }}

                  path: ./
                  remote_path: ${{ steps.release.outputs.remote-path }}
                  remote_host: ${{ steps.target.outputs.host }}
                  remote_user: ${{ steps.target.outputs.user }}
                  remote_key: ${{ secrets.SSH_KEY }}

            - name: Activate release
              if: steps.release.outputs.id != ''
              uses: TS1997/devops-templates/.github/actions/release@master
              with:
                  command: activate
                  host: ${{ steps.target.outputs.host }}
                  user: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}
                  id: ${{ steps.release.outputs.id }}
                  shared-paths: .env public/content/uploads ${{ inputs.shared_paths }}
                  keep: ${{ inputs.keep_releases }}
                  after-switch: ${{ inputs.post_deploy_commands }}

            - name: Execute post-deploy commands
              if: steps.release.outputs.id == '' && inputs.post_deploy_commands != ''
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ steps.target.outputs.host }}
                  username: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}
                  script: ${{ inputs.post_deploy_commands }}

            - name: Health check
              uses: TS1997/devops-templates/.github/actions/health-check@master
              with:
                  url: ${{ inputs.domain }}${{ inputs.health_check_path }}

            - name: Roll back release
              if: failure() && steps.release.outputs.id != ''
              uses: TS1997/devops-templates/.github/actions/release@master
              with:
                  command: rollback
                  host: ${{ steps.target.outputs.host }}
                  user: ${{ steps.target.outputs.user }}
                  key: ${{ secrets.SSH_KEY }}
                  id: ${{ steps.release.outputs.id }}
